<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Amplitude — Gestão de reabilitação esportiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300806B'/%3E%3Cpath d='M6 17h4l3-8 5 15 3-8h5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Gloock&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#F4F7F8}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:3px}

:root{
  --tela:#F4F7F8;--sup:#FFFFFF;--linha:#E2E9EC;--linha-forte:#CBD6DA;
  --t1:#0A1F1C;--t2:#5A6E72;--t3:#8C9EA3;
  --verde:#00806B;--verde-fraco:#E4F2EF;--verde-escuro:#04564A;
  --laranja:#D9603C;--laranja-fraco:#FCEDE8;
  --ambar:#C98A16;--ambar-fraco:#FDF3DE;
  --azul:#2A62CE;--azul-fraco:#E9F0FC;
  --r:10px;
  --ui:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
}
#sys{font-family:var(--ui);color:var(--t1);background:var(--tela);min-height:100vh;font-size:14px}
#sys.foi{display:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.wrap{display:flex;min-height:100vh}
.lateral{width:232px;flex:none;background:var(--sup);border-right:1px solid var(--linha);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{padding:18px 18px 16px;display:flex;align-items:center;gap:10px}
.marca-i{width:30px;height:30px;border-radius:8px;flex:none;background:linear-gradient(145deg,var(--verde),var(--verde-escuro));display:grid;place-items:center}
.marca-i svg{width:16px;height:16px}
.marca-t{font-weight:700;font-size:15px;letter-spacing:-.025em;line-height:1}
.marca-s{font-size:10px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.menu{padding:6px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.menu-r{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:14px 8px 6px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--t2);width:100%;text-align:left;transition:background .14s,color .14s}
.mi:hover{background:var(--tela);color:var(--t1)}
.mi.on{background:var(--verde-fraco);color:var(--verde-escuro);font-weight:600}
.mi svg{width:16px;height:16px;flex:none;opacity:.85}
.mi .pino{margin-left:auto;font-size:10px;font-weight:700;background:var(--laranja);color:#fff;border-radius:20px;padding:2px 6px;line-height:1.4}
.eu{border-top:1px solid var(--linha);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--azul-fraco);color:var(--azul);font-size:11px;font-weight:700}
.eu-n{font-size:12.5px;font-weight:600;line-height:1.25}
.eu-f{font-size:11px;color:var(--t3)}

.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--linha);padding:0 22px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.migalha{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t3);min-width:0;overflow:hidden;white-space:nowrap}
.migalha b{color:var(--t1);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.migalha span{opacity:.5;flex:none}
.busca{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--tela);border:1px solid var(--linha);border-radius:7px;padding:7px 11px;width:210px;color:var(--t3);font-size:12.5px;transition:border-color .15s;flex:none}
.busca:hover{border-color:var(--linha-forte)}
.busca svg{width:14px;height:14px;flex:none}
.busca kbd{margin-left:auto;font-size:10px;border:1px solid var(--linha-forte);border-radius:4px;padding:1px 5px;font-family:inherit}
.ib{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--t2);position:relative;transition:background .14s;flex:none}
.ib:hover{background:var(--tela)}
.ib svg{width:16px;height:16px}
.ib .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--laranja);border:1.5px solid var(--sup)}
.conteudo{padding:22px;max-width:1120px;width:100%;margin:0 auto;flex:1}

.dd{position:absolute;top:48px;right:14px;width:min(320px,calc(100vw - 28px));background:var(--sup);border:1px solid var(--linha);border-radius:12px;box-shadow:0 16px 44px rgba(10,31,28,.16);z-index:30;overflow:hidden;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:all .2s cubic-bezier(.22,1,.36,1);transform-origin:top right}
.dd.on{opacity:1;transform:none;pointer-events:auto}
.dd-c{padding:12px 14px;border-bottom:1px solid var(--linha);display:flex;align-items:center}
.dd-c b{font-size:12.5px;font-weight:600}
.dd-c i{margin-left:auto;font-size:11px;color:var(--t3);font-style:normal}
.dd-i{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--linha);width:100%;text-align:left;transition:background .12s}
.dd-i:last-child{border-bottom:none}
.dd-i:hover{background:var(--tela)}
.dd-p{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px}
.dd-t{font-size:12.5px;font-weight:500;line-height:1.4;display:block}
.dd-d{font-size:11.5px;color:var(--t3);margin-top:2px;display:block}

.btn{background:var(--verde);color:#fff;border-radius:7px;font-size:13px;font-weight:600;padding:10px 17px;transition:transform .14s,box-shadow .14s,background .14s;white-space:nowrap;font-family:var(--ui)}
.btn:hover{background:var(--verde-escuro);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.btn:disabled{opacity:.55;transform:none;box-shadow:none;cursor:default}
.btn-b{background:transparent;border:1px solid var(--linha-forte);color:var(--t2)}
.btn-b:hover{background:var(--tela);color:var(--t1);border-color:var(--t3);box-shadow:none}

.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cab-t{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.cab-s{font-size:13px;color:var(--t2);margin-top:4px}
.cab-a{margin-left:auto;display:flex;gap:8px}
.cab-a .btn{font-size:12.5px;padding:9px 15px}

.grade{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.65fr 1fr}
.cart{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:16px;position:relative}
.cc{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ct{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.cd{font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.4}
.ca{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--verde);white-space:nowrap}
.ca:hover{text-decoration:underline}
.kr{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.kv{font-size:27px;font-weight:600;letter-spacing:-.035em;margin:7px 0 4px;line-height:1}
.kv u{font-size:13px;font-weight:500;color:var(--t3);text-decoration:none;margin-left:2px}
.kn{font-size:11.5px;color:var(--t2);display:flex;align-items:center;gap:5px}
.seta{font-size:10px;font-weight:700}
.sobe{color:var(--verde)}
.selo{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.s-verde{background:var(--verde-fraco);color:var(--verde-escuro)}
.s-ambar{background:var(--ambar-fraco);color:#8A5E08}
.s-laranja{background:var(--laranja-fraco);color:#A83C1C}
.s-azul{background:var(--azul-fraco);color:var(--azul)}
.s-cinza{background:var(--tela);color:var(--t2)}

.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:0 10px 9px;border-bottom:1px solid var(--linha)}
.tab td{padding:11px 10px;border-bottom:1px solid var(--linha);font-size:13px;vertical-align:middle}
.tab tr:last-child td{border-bottom:none}
.tab tbody tr{transition:background .12s;cursor:pointer}
.tab tbody tr:hover{background:var(--tela)}
.pes{display:flex;align-items:center;gap:10px}
.pes-a{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--verde-fraco);color:var(--verde-escuro)}
.pes-n{font-weight:600;font-size:13px;line-height:1.3}
.pes-m{font-size:11.5px;color:var(--t3)}
.barra{height:5px;border-radius:3px;background:var(--linha);overflow:hidden;min-width:64px}
.barra i{display:block;height:100%;border-radius:3px;background:var(--verde)}

.svgr{width:100%;height:auto;display:block;overflow:visible}
.traco{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.desenha{stroke-dasharray:1400;stroke-dashoffset:1400;animation:risca 1.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes risca{to{stroke-dashoffset:0}}
.malha{stroke:var(--linha);stroke-width:1}
.et{font-size:9px;fill:var(--t3);font-family:"JetBrains Mono",monospace}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.leg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2)}
.leg i{width:9px;height:9px;border-radius:2px;flex:none}
.anelc{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.aneln{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.aneln u{font-size:13px;color:var(--t3);text-decoration:none;font-weight:500}

.crit{display:flex;flex-direction:column}
.crl{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--linha)}
.crl:last-child{border-bottom:none}
.cri{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.crn{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.crv{font-size:12px;font-weight:600}
.cra{font-size:11px;color:var(--t3);margin-left:6px;font-weight:400}

.lista{list-style:none}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--linha);width:100%;text-align:left}
.lista li:last-child .li{border-bottom:none}
.li.clic{cursor:pointer;transition:background .12s;border-radius:6px;padding-left:8px;padding-right:8px;margin:0 -8px}
.li.clic:hover{background:var(--tela)}
.lim{width:7px;height:7px;border-radius:50%;background:var(--verde);flex:none}
.lin{font-size:13px;font-weight:500;line-height:1.35;display:block}
.lid{font-size:11.5px;color:var(--t3);margin-top:1px;display:block}
.liv{margin-left:auto;font-size:11.5px;color:var(--t2);white-space:nowrap;text-align:right}

.fases{display:flex;gap:5px;margin-bottom:10px}
.fase{flex:1;height:6px;border-radius:3px;background:var(--linha);position:relative;overflow:hidden}
.fase.ok{background:var(--verde)}
.fase.agora{background:var(--verde-fraco)}
.fase.agora::after{content:"";position:absolute;inset:0;width:55%;background:var(--verde);border-radius:3px}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--linha)}
.tli{position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--sup);border:2.5px solid var(--linha-forte)}
.tli.mk::before{border-color:var(--verde);background:var(--verde)}
.tld{font-size:10.5px;color:var(--t3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tlt{font-size:13px;font-weight:600;margin:2px 0}
.tlp{font-size:12px;color:var(--t2);line-height:1.5}

.ag{display:flex;flex-direction:column}
.agl{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--linha);align-items:center;width:100%;text-align:left;transition:background .12s}
.agl:last-child{border-bottom:none}
.agl:hover{background:var(--tela)}
.agh{font-size:12.5px;font-weight:600;color:var(--t2);width:50px;flex:none}
.agb{width:3px;align-self:stretch;min-height:34px;border-radius:2px;flex:none}
.agn{font-size:13.5px;font-weight:600;display:block}
.agd{font-size:11.5px;color:var(--t3);margin-top:2px;display:block}
.agv{margin-left:auto;font-size:11.5px;color:var(--t2);white-space:nowrap}

.sk{background:linear-gradient(90deg,var(--linha) 25%,#EDF2F4 50%,var(--linha) 75%);background-size:200% 100%;animation:brilha 1.3s infinite;border-radius:5px}
@keyframes brilha{0%{background-position:200% 0}100%{background-position:-200% 0}}
.vazio{text-align:center;padding:34px 20px;color:var(--t3)}
.vazio svg{width:34px;height:34px;margin-bottom:12px;opacity:.45}
.vazio p{font-size:13px;line-height:1.5}

.veu{position:fixed;inset:0;background:rgba(6,20,18,.58);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.veu.on{opacity:1;pointer-events:auto}

.mdb{position:fixed;top:12vh;left:50%;transform:translateX(-50%) scale(.97);width:min(520px,calc(100vw - 28px));background:#FFF;border-radius:14px;z-index:86;box-shadow:0 24px 70px rgba(6,20,18,.3);overflow:hidden;font-family:var(--ui);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s cubic-bezier(.22,1,.36,1)}
.mdb.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.mdb-c{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--linha)}
.mdb-c svg{width:17px;height:17px;color:var(--t3);flex:none}
.mdb-c input{flex:1;border:none;outline:none;font-size:15px;background:none;min-width:0}
.mdb-c input::placeholder{color:var(--t3)}
.mdb-l{max-height:min(340px,52vh);overflow-y:auto;padding:7px}
.mdb-i{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;width:100%;text-align:left;transition:background .12s}
.mdb-i:hover,.mdb-i.sel{background:var(--verde-fraco)}
.mdb-p{padding:9px 17px;border-top:1px solid var(--linha);font-size:11px;color:var(--t3);display:flex;gap:14px}
.mdb-p b{font-weight:500;border:1px solid var(--linha);border-radius:4px;padding:1px 5px}

.painel{position:fixed;top:0;right:0;bottom:0;width:min(452px,100%);background:#FFF;color:var(--t1);font-family:var(--ui);font-size:14px;z-index:81;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);box-shadow:-20px 0 60px rgba(6,20,18,.28);overscroll-behavior:contain}
.painel.on{transform:translateX(0)}
.pc{padding:17px 20px 13px;border-bottom:1px solid var(--linha);background:#FFF;flex:none}
.pc1{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ptag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--verde-fraco);color:var(--verde-escuro);padding:3px 8px;border-radius:4px}
.px{margin-left:auto;color:var(--t3);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none}
.px:hover{background:var(--tela);color:var(--t1)}
.ptit{font-size:16px;font-weight:600;letter-spacing:-.015em}
.psub{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.5}
.pprog{display:flex;gap:4px;margin-top:13px}
.pprog i{flex:1;height:3px;border-radius:2px;background:var(--linha);transition:background .3s}
.pprog i.ok{background:var(--verde)}
.pcorpo{flex:1;min-height:0;overflow-y:auto;padding:20px;background:#FFF}
.passo{animation:sobe .34s cubic-bezier(.22,1,.36,1)}
@keyframes sobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pnum{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--verde);margin-bottom:14px}
.campo{margin-bottom:18px}
.campo:last-child{margin-bottom:0}
.rot{font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:7px;display:block}

.eva{display:flex;gap:4px}
.eva button{flex:1;aspect-ratio:1;border:1px solid var(--linha);border-radius:7px;font-weight:600;font-size:12.5px;color:var(--t2);transition:all .14s;display:grid;place-items:center;min-width:0}
.eva button:hover{border-color:var(--verde);color:var(--verde)}
.eva button.on{color:#fff;border-color:transparent}
.evar{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:7px}

.ops{display:flex;flex-direction:column;gap:7px}
.op{display:flex;align-items:center;gap:11px;text-align:left;width:100%;border:1px solid var(--linha);border-radius:8px;padding:11px 13px;font-size:13.5px;transition:all .15s;background:#FFF}
.op:hover{border-color:var(--verde);background:var(--verde-fraco)}
.op.on{border-color:var(--verde);background:var(--verde-fraco);font-weight:600;color:var(--verde-escuro)}
.opb{width:17px;height:17px;border-radius:5px;border:1.8px solid var(--linha-forte);flex:none;display:grid;place-items:center;transition:border-color .15s}
.op.on .opb{border-color:var(--verde)}
.op.on .opb::after{content:"";width:9px;height:9px;border-radius:1px;background:var(--verde)}
.op-d{font-size:11.5px;color:var(--t3);font-weight:400;margin-top:1px;display:block}

.num{display:flex;align-items:center;gap:10px}
.num input{width:100%;border:1px solid var(--linha);border-radius:8px;padding:11px 13px;font-size:14px;outline:none;transition:border-color .15s}
.num input:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-fraco)}
.num span{font-size:13px;color:var(--t3);flex:none}

.txa{width:100%;border:1px solid var(--linha);border-radius:8px;padding:12px;font-size:13.5px;line-height:1.6;min-height:126px;resize:vertical;background:#FFF;outline:none;transition:border-color .15s;font-family:var(--ui)}
.txa::placeholder{color:var(--t3)}
.txa:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-fraco)}
.cchar{font-size:11px;color:var(--t3);text-align:right;margin-top:6px}
.pfe{padding:13px 20px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);flex:none;display:flex;align-items:center;gap:10px;background:#FFF}
.pfe .pn{font-size:11.5px;color:var(--t3);margin-right:auto}
.resumo{background:var(--tela);border-radius:9px;padding:12px 14px}
.resumo-l{display:flex;gap:10px;padding:6px 0;font-size:12.5px;align-items:baseline}
.resumo-l b{color:var(--t2);font-weight:500;min-width:104px;flex:none}
.resumo-l span{color:var(--t1);font-weight:500}

function pts(v,max,w,h){const px=w/(v.length-1);return v.map((x,i)=>`${(i*px).toFixed(1)},${(h-(x/max)*h).toFixed(1)}`).join(" ");}
function grafico(a){
 const W=560,H=170,n=a.dor.length,px=W/(n-1);
 const marcas=[0,Math.floor((n-1)/3),Math.floor(2*(n-1)/3),n-1];
 return `<svg viewBox="0 0 ${W} ${H+26}" class="svgr">
  ${[0,.25,.5,.75,1].map(f=>`<line class="malha" x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}"/>`).join("")}
  <polyline class="traco desenha" points="${pts(a.carga,100,W,H)}" stroke="var(--azul)" opacity=".85" style="animation-delay:.15s"/>
  <polyline class="traco desenha" points="${pts(a.dor,10,W,H)}" stroke="var(--laranja)"/>
  ${a.dor.map((v,i)=>`<circle cx="${(i*px).toFixed(1)}" cy="${(H-(v/10)*H).toFixed(1)}" r="2.6" fill="var(--laranja)"/>`).join("")}
  ${marcas.map(i=>`<text class="et" x="${(i*px).toFixed(0)}" y="${H+17}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">S${i+1}</text>`).join("")}
 </svg>
 <div class="leg"><span><i style="background:var(--laranja)"></i>Dor referida (EVA 0–10)</span><span><i style="background:var(--azul)"></i>Carga semanal acumulada (%)</span></div>`;
}
function anel(v,max,rot){
 const r=38,c=2*Math.PI*r,off=c-(v/max)*c;
 return `<div class="anelc">
  <svg width="94" height="94" viewBox="0 0 94 94" style="flex:none">
   <circle cx="47" cy="47" r="${r}" fill="none" stroke="var(--linha)" stroke-width="9"/>
   <circle cx="47" cy="47" r="${r}" fill="none" stroke="var(--verde)" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 47 47)">
    <animate attributeName="stroke-dashoffset" from="${c}" to="${off}" dur="1.2s" fill="freeze"
     calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
   </circle>
  </svg>
  <div><div class="aneln">${v}<u>/${max}</u></div><div class="kn" style="margin-top:6px">${rot}</div></div>
 </div>`;
}

 bres=ATLETAS.map((a,i)=>({a,i})).filter(({a})=>!q||(a.n+" "+a.d+" "+a.p).toLowerCase().includes(q));
 if(!bres.length){
  mdbL.innerHTML=`<div class="vazio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><p>Nenhum atleta encontrado.</p></div>`;return;
 }
 if(bsel>=bres.length)bsel=0;
 mdbL.innerHTML=bres.map((r,j)=>`<button class="mdb-i ${j===bsel?'sel':''}" data-j="${j}">
  <span class="pes-a">${r.a.i}</span>
  <span style="flex:1;min-width:0"><span class="pes-n" style="display:block">${r.a.n}</span><span class="pes-m">${r.a.d}</span></span>
  <span class="selo s-${r.a.cor}">${r.a.st}</span></button>`).join("");
 mdbL.querySelectorAll(".mdb-i").forEach(b=>b.onclick=()=>abrirBuscado(+b.dataset.j));
}
function abrirBuscado(j){const r=bres[j];if(!r)return;fecharBusca();ir("ficha",r.i);}
function abrirBusca(){document.getElementById("veu").classList.add("on");mdb.classList.add("on");mdbIn.value="";bsel=0;pintaBusca();setTimeout(()=>mdbIn.focus(),140);}
function fecharBusca(){document.getElementById("veu").classList.remove("on");mdb.classList.remove("on");}
document.getElementById("btBusca").onclick=abrirBusca;
document.getElementById("btBuscaMb").onclick=abrirBusca;
document.getElementById("mdbX").onclick=fecharBusca;
mdbIn.oninput=()=>{bsel=0;pintaBusca();};
mdbIn.onkeydown=e=>{
 if(e.key==="ArrowDown"){e.preventDefault();bsel=Math.min(bsel+1,bres.length-1);pintaBusca();}
 if(e.key==="ArrowUp"){e.preventDefault();bsel=Math.max(bsel-1,0);pintaBusca();}
 if(e.key==="Enter"){e.preventDefault();abrirBuscado(bsel);}
};

/* ── auto-encaixe: cada página reduz a própria escala até caber, sem scroll ── */
let fitCache={};
function poe(el,html,chave){
 el.innerHTML=`<div class="fit">${html}</div>`;
 const f=el.firstElementChild;
 const aplica=s=>{f.style.width=(100/s).toFixed(3)+"%";f.style.height=(100/s).toFixed(3)+"%";f.style.transform=`scale(${s})`;};
 let s=fitCache[chave];
 if(s==null){
  s=1;aplica(s);
  let guarda=0;
  while(f.scrollHeight>f.clientHeight+2&&s>0.66&&guarda++<12){s=+(s-0.04).toFixed(2);aplica(s);}
  fitCache[chave]=s;
 }else aplica(s);
}
window.addEventListener("resize",()=>{
 fitCache={};
 if(document.getElementById("miolo").classList.contains("on")&&!virando)render();
});

function render(){
 const b=bloco(CAPITULOS[atual],atual);
 poe(pgE,b.e,atual+":e");poe(pgD,b.d,atual+":d");
 pintaMapa();
}
function pintaMapa(){
 trilho.innerHTML=CAPITULOS.map((c,i)=>
  `<button class="pt ${i===atual?'aqui':''} ${i<atual?'andou':''}" onclick="irCap(${i})" aria-label="${c.estacao}"><i></i></button>`).join("");
 letreiro.innerHTML=`<b>${CAPITULOS[atual].estacao}</b>`;
 cn.textContent=`${atual+1} / ${CAPITULOS.length}`;
}

/* ── motor de virada: drag interativo + tween próprio (física de papel) ── */
const palco=document.getElementById("palco");
const fsom=document.getElementById("fsom"),fvs=document.getElementById("fvs");
const vsom=document.getElementById("vsom");
const gdica=document.getElementById("gdica");
let G=null,rafId=0,pPend=null,jaFolheou=false,tweenId=0;

const ehMovel=()=>window.innerWidth<=820;
const easeSai=t=>1-Math.pow(1-t,3);          /* página ganhando velocidade e assentando */
const easeAssenta=t=>1-Math.pow(1-t,4);      /* pouso mais macio no fim */

function prepara(alvo){
 if(virando||alvo<0||alvo>=CAPITULOS.length||alvo===atual)return null;
 const dir=alvo>atual?1:-1;
 const A=bloco(CAPITULOS[atual],atual),D=bloco(CAPITULOS[alvo],alvo);
 const modo=ehMovel()?"pagina":"flip";
 folha.classList.toggle("plana",modo==="pagina");
 if(modo==="flip"){
  if(dir>0){poe(flF,A.d,atual+":d");poe(flV,D.e,alvo+":e");poe(pgD,D.d,alvo+":d");}
  else{poe(flF,D.d,alvo+":d");poe(flV,A.e,atual+":e");poe(pgE,D.e,alvo+":e");}
 }else{
  /* página única: a folha sai girando pela lombada e a nova assenta por cima */
  poe(flF,A.d,atual+":d");
  poe(pgD,D.d,alvo+":d");
 }
 virando=true;
 G={alvo,dir,modo,A,D,W:palco.clientWidth*(modo==="flip"?0.55:0.8),p:0,face:"A"};
 aplicaP(0);
 folha.classList.add("viva");
 return G;
}

function aplicaP(p){
 const g=G;if(!g)return;
 g.p=p;
 if(g.modo==="flip"){
  const ang=g.dir>0?-180*p:-180+180*p;
  folha.style.transform=`rotateY(${ang}deg)`;
  const vis=g.dir>0?p:1-p;
  fsom.style.opacity=(Math.sin(Math.min(vis,.5)*Math.PI)*.9).toFixed(3);
  fvs.style.opacity=(Math.sin(Math.max(vis-.5,0)*Math.PI)*.9).toFixed(3);
  vsom.style.opacity=(Math.sin(p*Math.PI)*.5).toFixed(3);
  vsom.style.transform=g.dir>0?"scaleX(1)":"scaleX(-1)";
 }else{
  /* half-flip: 0→½ a página atual levanta até 90°; ½→1 a nova assenta de 90°→0 */
  const s=g.dir>0?-1:1;
  let ang;
  if(p<0.5){
   if(g.face!=="A"){g.face="A";poe(flF,g.A.d,(atual)+":d");}
   ang=s*180*p;
  }else{
   if(g.face!=="D"){g.face="D";poe(flF,g.D.d,(g.alvo)+":d");}
   ang=-s*180*(1-p);
  }
  folha.style.transform=`rotateY(${ang}deg)`;
  fsom.style.opacity=(Math.sin(p*Math.PI)*.75).toFixed(3);
  vsom.style.opacity=(Math.sin(p*Math.PI)*.55).toFixed(3);
  vsom.style.transform="scaleX(1)";
 }
}
function agenda(p){
 pPend=p;
 if(rafId)return;
 rafId=requestAnimationFrame(()=>{rafId=0;if(G&&pPend!==null){aplicaP(pPend);pPend=null;}});
}

function finaliza(completa){
 if(!G)return;
 const g=G;
 const fecha=()=>{
  if(completa){
   atual=g.alvo;
   if(g.modo==="flip"){if(g.dir>0)poe(pgE,g.D.e,atual+":e");else poe(pgD,g.D.d,atual+":d");}
   pintaMapa();
   if(!jaFolheou){jaFolheou=true;gdica.classList.add("some");}
  }else{
   if(g.modo==="flip"){if(g.dir>0)poe(pgD,g.A.d,atual+":d");else poe(pgE,g.A.e,atual+":e");}
   else poe(pgD,g.A.d,atual+":d");
  }
  folha.classList.remove("viva");
  fsom.style.opacity=0;fvs.style.opacity=0;vsom.style.opacity=0;
  virando=false;G=null;
 };
 if(quieto){aplicaP(completa?1:0);fecha();return;}
 const p0=g.p,p1=completa?1:0;
 const restante=Math.abs(p1-p0);
 const dur=Math.max(180,Math.min(700,Math.round(760*restante+150)));
 const t0=performance.now();
 const ease=completa?easeAssenta:easeSai;
 cancelAnimationFrame(tweenId);
 (function passo(agora){
  if(!G||G!==g){return;}
  const t=Math.min(1,(agora-t0)/dur);
  aplicaP(p0+(p1-p0)*ease(t));
  if(t<1)tweenId=requestAnimationFrame(passo);
  else fecha();
 })(t0);
}

window.irCap=dest=>{
 if(quieto){if(dest>=0&&dest<CAPITULOS.length&&!virando){atual=dest;render();}return;}
 const g=prepara(dest);
 if(g)finaliza(true);
};

/* a última página assenta quando o livro termina de abrir */
function assenta(){
 if(quieto||virando)return;
 const modo=ehMovel()?"pagina":"flip";
 folha.classList.toggle("plana",modo==="pagina");
 poe(flF,bloco(CAPITULOS[atual],atual).d,atual+":d");
 if(modo==="flip")flV.innerHTML="";
 folha.classList.add("viva");
 const t0=performance.now(),dur=520,a0=modo==="flip"?-64:-52;
 virando=true;
 (function passo(agora){
  const t=Math.min(1,(agora-t0)/dur);
  const ang=a0*(1-easeAssenta(t));
  folha.style.transform=`rotateY(${ang}deg)`;
  fsom.style.opacity=(Math.sin(Math.min(-ang/90,1)*Math.PI/2)*.8).toFixed(3);
  vsom.style.opacity=(Math.min(-ang/90,1)*.45).toFixed(3);
  if(t<1)requestAnimationFrame(passo);
  else{folha.classList.remove("viva");fsom.style.opacity=0;vsom.style.opacity=0;virando=false;}
 })(t0);
}

/* gesto: mouse e toque, com a página seguindo o dedo */
let P=null;
palco.addEventListener("pointerdown",e=>{
 if(virando){P=null;return;}
 P={x:e.clientX,y:e.clientY,id:e.pointerId,t:performance.now(),cap:false,dx:0};
},{passive:true});

palco.addEventListener("pointermove",e=>{
 if(!P)return;
 const dx=e.clientX-P.x,dy=e.clientY-P.y;
 P.dx=dx;
 if(!P.cap){
  if(Math.abs(dy)>16&&Math.abs(dy)>Math.abs(dx)){P=null;return;}          /* deixa rolar o texto */
  if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.15){
   const g=prepara(atual+(dx<0?1:-1));
   if(!g){P=null;return;}
   P.cap=true;
   palco.classList.add("pegando");
   try{palco.setPointerCapture(P.id);}catch(_){}
  }else return;
 }
 if(P.cap&&G){
  e.preventDefault();
  agenda(Math.min(1,Math.max(0,(G.dir>0?-dx:dx)/G.W)));
 }
});

function solta(e){
 palco.classList.remove("pegando");
 if(!P){return;}
 if(P.cap&&G){
  if(pPend!==null){const pu=pPend;pPend=null;aplicaP(pu);}   /* aplica o último movimento antes de decidir */
  const dt=Math.max(1,performance.now()-P.t);
  const vel=Math.abs(P.dx)/dt;                       /* px por ms */
  finaliza(G.p>0.3||(vel>0.45&&G.p>0.06));
 }
 P=null;
}
palco.addEventListener("pointerup",solta);
palco.addEventListener("pointercancel",solta);
palco.addEventListener("lostpointercapture",()=>{palco.classList.remove("pegando");});

document.addEventListener("keydown",e=>{
 const noLivro=document.getElementById("livro").classList.contains("on");
 const noPainel=document.getElementById("painel").classList.contains("on");
 const naBusca=mdb.classList.contains("on");
 if(noLivro){
  if(e.key==="ArrowRight")irCap(atual+1);
  if(e.key==="ArrowLeft")irCap(atual-1);
  return;
 }
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();abrirBusca();return;}
 if(e.key==="Escape"){fecharRegistro();fecharBusca();ddSino.classList.remove("on");}
 if((e.key==="l"||e.key==="L")&&!noPainel&&!naBusca)abrirLivro();
});
